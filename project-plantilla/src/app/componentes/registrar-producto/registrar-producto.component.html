<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
        <div class="row justify-content-center align-items-center h-100">
            <div class="col-12 col-lg-9 col-xl-7">
                <div class="card shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="mb-4">Registrar Producto</h3>
                        <form>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" id="codigo" class="form-control form-control-lg"
                                            required />
                                        <label for="codigo">Código</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="text" id="nombre" class="form-control form-control-lg"
                                            required />
                                        <label for="nombre">Nombre</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="number" id="stock" class="form-control form-control-lg"
                                            min="1" step="1" required />
                                        <label for="stock">Stock</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-floating">
                                        <input type="price" id="precio" class="form-control form-control-lg"
                                            required />
                                        <label for="precio">Precio</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-6">
                                    <div class="form-floating">
                                        <select class="form-select form-select-lg" id="categoria" required>
                                            <option value="" disabled selected>Seleccione una categoría</option>
                                            <option *ngFor="let categoria of categorias" [value]="categoria.idcategoria">
                                                {{categoria.descripcion}}
                                            </option>
                                        </select>
                                        <label for="categoria">Categoría</label>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="form-floating">
                                        <select class="form-select form-select-lg" id="proveedor" required>
                                            <option value="" disabled selected>Seleccione un proveedor</option>
                                            <option *ngFor="let proveedor of proveedores" [value]="proveedor.idproveedor">
                                                {{proveedor.nombre}}
                                            </option>
                                        </select>
                                        <label for="proveedor">Proveedor</label>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-6">
                                    <h6 class="mb-2 pb-1">Estado:</h6>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="estado" id="estadoActivo"
                                            value="1" checked />
                                        <label class="form-check-label" for="estadoActivo">Disponible</label>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <input class="form-check-input" type="radio" name="estado" id="estadoInactivo"
                                            value="0" />
                                        <label class="form-check-label" for="estadoInactivo">No Disponible</label>
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4 pt-2">
                                <button type="submit" class="btn btn-primary btn-lg w-100">Registrar</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
